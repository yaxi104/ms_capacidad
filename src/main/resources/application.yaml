management:
  tracing:
    sampling:
      probability: 0.0
    baggage:
      correlation:
        fields:
          - messageId
          - x-message-id
      remote-fields: messageId,x-message-id
  endpoints:
    web:
      exposure:
        include: health, metrics, loggers
      base-path: /
      path-mapping:
        health: actuator/health
        metrics: actuator/metrics
        loggers: resilient-api/actuator/loggers
  endpoint:
    health:
      probes:
        enabled: false
      show-details: "always"
  health:
    circuitbreakers:
      enabled: true
    diskspace:
      enabled: false
    r2dbc:
      enabled: true
    ping:
      enabled: false
    refresh:
      enabled: false

clients:
  capacity-technology:
    base-url: "${CAPACITY_TECHNOLOGY_BASE_URL:http://localhost:8081}"
    timeout-ms: 3000

resilience4j:
  circuitbreaker:
    circuit-breaker-aspect-order: 1
    configs:
      default:
        register-health-indicator: true
        failure-rate-threshold: 50
        slow-call-rate-threshold: 50
        slow-call-duration-threshold: 2s
        sliding-window-size: 5
        minimum-number-of-calls: 5
        wait-duration-in-open-state: 25s
        max-wait-duration-in-half-open-state: 5s
        permitted-number-of-calls-in-half-open-state: 2
        automatic-transition-from-open-to-half-open-enabled: false
        record-exceptions:
          - java.util.concurrent.TimeoutException
        ignore-exceptions:
          - com.reactivo.capacidad.domain.exceptions.BusinessException

    instances:
      capacityTechnology:
        base-config: default

  retry:
    configs:
      default:
        maxAttempts: 3
        waitDuration: 1000ms
        enableExponentialBackoff: true
        exponentialBackoffMultiplier: 1.5
        maxWaitDuration: 10000ms
        initialInterval: 500ms
    instances:
      capacityTechnologyRetry:
        base-config: default

  bulkhead:
    configs:
      default:
        maxConcurrentCalls: 5
        maxWaitDuration: 1s
    instances:
      capacityTechnologyBulkhead:
        base-config: default
